<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brads Automod Bypass</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1b1e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #2b2d31;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 28px;
      color: #fff;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #40444b;
      border-radius: 8px;
      background: #1e1f22;
      color: #fff;
      font-size: 1.05rem;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #5865f2;
    }
    button.send {
      width: 100%;
      padding: 14px;
      background: #5865f2;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button.send:hover {
      background: #4752c4;
    }
    .output-box {
      background: #1e1f22;
      border: 1px solid #40444b;
      border-radius: 8px;
      padding: 16px;
      min-height: 56px;
      word-break: break-all;
      font-size: 1.15rem;
      margin-bottom: 12px;
    }
    button.copy {
      width: 100%;
      padding: 12px;
      background: #3ba55d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.copy:hover {
      background: #2d7d46;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Brads Automod Bypass</h1>

    <input type="text" id="word" placeholder="Type a word..." autocomplete="off">

    <button class="send" onclick="generate()">Send</button>

    <div class="output-box" id="output"></div>
    <button class="copy" onclick="copyResult()">Copy</button>
  </div>

  <script>
    const homoglyphs = {
      'a': 'а', 'e': 'е', 'o': 'о', 'c': 'с', 'i': 'і',
      'p': 'р', 'y': 'у', 'x': 'х', 's': 'ѕ', 'h': 'һ',
      'j': 'ј', 'A': 'А', 'E': 'Е', 'O': 'О', 'C': 'С',
      'I': 'І', 'P': 'Р', 'Y': 'Υ', 'X': 'Х', 'S': 'Ѕ',
      'H': 'Н', 'B': 'В', 'M': 'М', 'T': 'Т', 'K': 'К'
    };

    let lastResult = '';

    function generate() {
      const word = document.getElementById('word').value.trim();
      if (!word) {
        document.getElementById('output').textContent = '';
        return;
      }

      lastResult = word.split('').map(char => homoglyphs[char] || char).join('');
      document.getElementById('output').textContent = lastResult;
    }

    function copyResult() {
      if (!lastResult) return;
      navigator.clipboard.writeText(lastResult);
    }

    document.getElementById('word').addEventListener('keypress', e => {
      if (e.key === 'Enter') generate();
    });
  </script>
</body>
</html>
